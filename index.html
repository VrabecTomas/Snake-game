<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Snake Game</title>
  <style>
    body {
      background: #111;
      color: #fff;
      text-align: center;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .logo-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }
    .snake-logo {
      width: 35px;
      height: 35px;
    }
    h1 {
      font-size: 2rem;
      letter-spacing: 2px;
    }
    .score {
      font-size: 1.1rem;
      margin-bottom: 15px;
    }
    canvas {
      background: #222;
      border: 2px solid #f00;
    }
  </style>
</head>
<body>

  <div class="logo-title">
    <svg class="snake-logo" viewBox="0 0 100 100">
      <path d="M 80 20 C 70 10, 30 10, 20 30 C 10 50, 30 60, 50 60 C 80 60, 90 80, 70 90 C 50 100, 20 80, 20 70" fill="none" stroke="#4ecca3" stroke-width="12" stroke-linecap="round"/>
      <circle cx="75" cy="22" r="3" fill="#111"/>
    </svg>
    <h1>SNAKE GAME</h1>
  </div>
  <div class="score">Skóre: <span id="s">0</span></div>

  <canvas id="c" width="400" height="400"></canvas>

  <script>
    const c = document.getElementById("c"), x = c.getContext("2d"), s = document.getElementById("s");
    let b = 20, snake = [{x: 200, y: 200}], d = {x: b, y: 0}, score = 0;
    let f = {x: Math.floor(Math.random()*20)*b, y: Math.floor(Math.random()*20)*b};

    document.addEventListener("keydown", e => {
      let k = e.key.toLowerCase();
      if ((k == "arrowleft"  || k == "a") && d.x == 0) d = {x: -b, y: 0};
      if ((k == "arrowup"    || k == "w") && d.y == 0) d = {x: 0, y: -b};
      if ((k == "arrowright" || k == "d") && d.x == 0) d = {x: b, y: 0};
      if ((k == "arrowdown"  || k == "s") && d.y == 0) d = {x: 0, y: b};
    });

    setInterval(() => {
      let h = {x: snake[0].x + d.x, y: snake[0].y + d.y};
      
      if (h.x < 0 || h.x >= 400 || h.y < 0 || h.y >= 400 || snake.some(p => p.x == h.x && p.y == h.y)) 
        return location.reload();

      snake.unshift(h);
      if (h.x == f.x && h.y == f.y) {
        s.innerText = ++score;
        f = {x: Math.floor(Math.random()*20)*b, y: Math.floor(Math.random()*20)*b};
      } else snake.pop();

      x.fillStyle = "#222"; x.fillRect(0, 0, 400, 400);
      x.fillStyle = "#4ecca3"; x.fillRect(f.x, f.y, b, b);
      x.fillStyle = "#f00"; snake.forEach(p => x.fillRect(p.x, p.y, b, b));
    }, 100);
  </script>
</body>
</html>
